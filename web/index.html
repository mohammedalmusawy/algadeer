<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="منصة الغدير — أطباء، مختبرات، أشعة. معاً لصحة أفضل.">

  <!-- معاينة الرابط بالواتساب وفيسبوك: الصورة لازم بعنوان كامل. -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ar_IQ">
  <meta property="og:site_name" content="منصة الغدير">
  <meta property="og:title" content="منصة الغدير — دليلك الصحي في الشطرة">
  <meta property="og:description" content="أطباء، مختبرات، أشعة، صيدليات وخدمات الشطرة بمكان واحد. تواصل بالواتساب أو الاتصال بضغطة.">
  <meta property="og:image" content="https://frolicking-sawine-d5ecbb.netlify.app/icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta name="twitter:card" content="summary">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="منصة الغدير">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>منصة الغدير</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration and give the user
    feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- تنبيه «أضف الغدير للشاشة الرئيسية»: الويب فقط، مرة وحدة، وما يطلع بوضع standalone.
       أندرويد وكروم/إيدج الكمبيوتر: زر «ثبّت الغدير» يثبّت بضغطة. الآيفون: خطوتين (أبل ما تسمح بالتثبيت بضغطة). -->
  <style>
    #gh-a2hs {
      position: fixed; z-index: 2147483000; left: 12px; right: 12px;
      top: calc(12px + env(safe-area-inset-top, 0px));
      max-width: 420px; margin: 0 auto; direction: rtl;
      background: #FFFFFF; color: #0F2A3D; border-radius: 18px;
      border: 1px solid #E1ECEE; box-shadow: 0 12px 32px rgba(0, 61, 130, .18);
      font-family: -apple-system, "SF Arabic", "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif;
      overflow: hidden; animation: gh-a2hs-in .3s ease-out;
    }
    #gh-a2hs .bar { height: 4px; background: linear-gradient(90deg, #0FAFA3, #003D82); }
    #gh-a2hs .row { display: flex; align-items: center; gap: 10px; padding: 12px 14px 4px; }
    #gh-a2hs img { width: 40px; height: 40px; border-radius: 11px; }
    #gh-a2hs .row b { flex: 1; font-size: 15px; }
    #gh-a2hs .x {
      border: 0; background: #EAF4F6; color: #003D82; width: 30px; height: 30px;
      border-radius: 50%; font-size: 18px; line-height: 30px; cursor: pointer; padding: 0;
    }
    #gh-a2hs .sub { margin: 0; padding: 2px 14px 0 14px; font-size: 14px; line-height: 1.7; color: #5B6C70; }
    #gh-a2hs .install {
      display: block; width: calc(100% - 28px); margin: 10px 14px 14px; padding: 12px;
      border: 0; border-radius: 14px; background: #0FAFA3; color: #FFFFFF;
      font: inherit; font-size: 16px; font-weight: 800; cursor: pointer;
    }
    #gh-a2hs ol { margin: 0; padding: 4px 34px 14px 14px; font-size: 14px; line-height: 1.8; color: #5B6C70; }
    #gh-a2hs ol b { color: #0FAFA3; font-size: 14px; }
    @keyframes gh-a2hs-in { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
  </style>
  <script>
    (function () {
      var KEY = 'ghadeer_a2hs_shown';
      try { if (localStorage.getItem(KEY)) return; } catch (e) { return; }
      var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
        window.navigator.standalone === true;
      if (standalone) return;
      var ua = navigator.userAgent || '';
      var ios = /iPhone|iPad|iPod/i.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var android = /Android/i.test(ua);

      // كروم/إيدج يرسلون هذا الحدث إذا الموقع قابل للتثبيت — نحتفظ بيه للزر.
      var deferred = null;
      var box = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferred = e;
        if (box) showInstallButton();
      });
      window.addEventListener('appinstalled', function () {
        deferred = null;
        if (box) box.remove();
      });

      function showInstallButton() {
        if (!box || !deferred || box.querySelector('.install')) return;
        var ol = box.querySelector('ol');
        if (ol) ol.remove();
        var sub = document.createElement('p');
        sub.className = 'sub';
        sub.textContent = 'يصير الغدير أيقونة على جهازك ويفتح مثل التطبيق.';
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'install';
        btn.textContent = 'ثبّت الغدير';
        btn.onclick = function () {
          var p = deferred;
          deferred = null;
          if (!p) return;
          p.prompt();
          p.userChoice.then(function () { box.remove(); }, function () { box.remove(); });
        };
        box.appendChild(sub);
        box.appendChild(btn);
      }

      setTimeout(function () {
        // الكمبيوتر: يطلع بس إذا المتصفح يدعم التثبيت بضغطة.
        if (!ios && !android && !deferred) return;
        try { localStorage.setItem(KEY, '1'); } catch (e) {}
        var title = ios || android ? 'أضف الغدير للشاشة الرئيسية' : 'ثبّت الغدير على جهازك';
        box = document.createElement('div');
        box.id = 'gh-a2hs';
        box.setAttribute('role', 'dialog');
        box.innerHTML = '<div class="bar"></div><div class="row">' +
          '<img src="icons/Icon-192.png" alt="">' +
          '<b>' + title + '</b>' +
          '<button type="button" class="x" aria-label="إغلاق">×</button></div>';
        box.querySelector('.x').onclick = function () { box.remove(); };
        if (deferred) {
          showInstallButton();
        } else {
          var steps = ios
            ? ['اضغط زر <b>المشاركة</b> بالمتصفح', 'اختار <b>إضافة إلى الشاشة الرئيسية</b>']
            : ['افتح <b>قائمة المتصفح</b> (⋮)', 'اختار <b>إضافة للشاشة الرئيسية</b>'];
          var ol = document.createElement('ol');
          ol.innerHTML = '<li>' + steps[0] + '</li><li>' + steps[1] + '</li>';
          box.appendChild(ol);
        }
        document.body.appendChild(box);
      }, 4000);
    })();
  </script>
</body>
</html>
